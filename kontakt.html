<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boka bord – Kafé Kardemumma</title>
  </head>

  <body>
    <header>
      <h1>Kafé Kardemumma</h1>
      <nav aria-label="Huvudmeny">
        <ul>
          <li><a href="index.html">Startsida</a></li>
          <li><a href="index.html#meny">Meny</a></li>
          <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Boka bord</h2>
      <form action="#" method="post">
        <p>
          Fyll i formuläret så bekräftar vi din bokning inom ett dygn. Fält
          markerade med * är obligatoriska.
        </p>
        <div class="falt">
          <label for="namn">Namn *</label>
          <input
            type="text"
            id="namn"
            name="namn"
            autocomplete="name"
            required
          />
        </div>

        <div class="falt">
          <label for="email">E-postadress *</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="falt">
          <label for="telefon">Telefon (valfritt)</label>
          <input type="tel" id="telefon" name="telefon" autocomplete="tel" />
        </div>

        <div class="falt">
          <label for="datum">Datum *</label>
          <input type="date" id="datum" name="datum" required />
        </div>
        <div class="falt">
          <label for="antal">Antal personer *</label>
          <select id="antal" name="antal" required>
            <option value="">Välj antal personer</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5+">5 eller fler</option>
          </select>
        </div>

        <div class="falt">
          <label for="onskemal">Övriga önskemål</label>
          <textarea id="onskemal" name="onskemal" rows="4"></textarea>
        </div>
        <fieldset>
          <legend>Kostönskemål</legend>

          <div>
            <input
              type="checkbox"
              id="vegetarisk"
              name="kost"
              value="vegetarisk"
            />
            <label for="vegetarisk">Vegetarisk</label>
          </div>

          <div>
            <input type="checkbox" id="vegansk" name="kost" value="vegansk" />
            <label for="vegansk">Vegansk</label>
          </div>

          <div>
            <input
              type="checkbox"
              id="glutenfri"
              name="kost"
              value="glutenfri"
            />
            <label for="glutenfri">Glutenfri</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Hur vill du få bekräftelsen? *</legend>

          <div>
            <input
              type="radio"
              id="bekraftelse-email"
              name="bekraftelse"
              value="email"
              required
            />
            <label for="bekraftelse-email">E-post</label>
          </div>

          <div>
            <input
              type="radio"
              id="bekraftelse-sms"
              name="bekraftelse"
              value="sms"
            />
            <label for="bekraftelse-sms">SMS</label>
          </div>
        </fieldset>
        <div class="falt">
          <input type="checkbox" id="samtycke" name="samtycke" required />
          <label for="samtycke">
            Jag godkänner att Kafé Kardemumma sparar mina uppgifter för
            bokningen. *
          </label>
        </div>

        <button type="submit">Skicka bokning</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Kafé Kardemumma</p>
      <address>
        Fiktivgatan 1, 111 11 Stockholm<br />
        <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
      </address>
    </footer>
  </body>
</html>
